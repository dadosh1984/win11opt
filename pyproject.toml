[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "win11opt"
version = "1.9.4"
description = "Native single-EXE Win11 optimizer (XP-like responsiveness)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "win11opt contributors" }]
dependencies = []

[project.scripts]
win11opt = "win11opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Паттерны намеренные: парсим stdout (не exit code), защита от любых ошибок,
# локальный timestamp для имени файла.
ignore = [
    "PLW1510",  # subprocess.run без check — мы парсим stdout
    "BLE001",   # except Exception — защита bench-парсера
    "DTZ005",   # datetime.now() без tz — локальный timestamp ОК
]
